<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>校园墙</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- 登录/注册弹窗 -->
<div id="loginModal" class="modal active">
  <div class="modal-content login-box">
    <div class="login-icon">🏫</div>
    <h2>校园墙</h2>
    <p class="login-sub" id="loginSub">注册账号，加入你的校园</p>
    <div class="form-group">
      <label>昵称</label>
      <input type="text" id="nicknameInput" placeholder="输入昵称..." maxlength="12" />
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="passwordInput" placeholder="输入密码..." maxlength="20" />
    </div>
    <div class="form-group" id="confirmGroup">
      <label>确认密码</label>
      <input type="password" id="confirmInput" placeholder="再次输入密码..." maxlength="20" />
    </div>
    <div id="pwdRules" class="pwd-rules"></div>
    <button class="btn btn-primary btn-block" id="loginBtn">注 册</button>
    <p class="switch-mode">
      <span id="switchText">已有账号？</span>
      <a id="switchLink" href="#">去登录</a>
    </p>
  </div>
</div>

<!-- 顶部导航 -->
<header id="header">
  <span class="header-title">🏫 校园墙</span>
  <span class="header-user" id="headerUser"></span>
</header>

<!-- ===== 刷帖面板 ===== -->
<main id="panelSquare" class="panel active">
  <div id="postList"><div class="tip">加载中...</div></div>
</main>

<!-- ===== 发帖面板 ===== -->
<main id="panelPost" class="panel">
  <div class="post-page">
    <textarea id="postContent" placeholder="分享你的校园生活..." maxlength="500"></textarea>
    <div class="char-count"><span id="charCount">0</span>/500</div>
    <div class="image-grid" id="imageGrid"></div>
    <div class="toolbar">
      <button class="tool-btn" id="btnPickImage">📷 图片</button>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
      <label class="tool-btn anon-label"><input type="checkbox" id="anonCheck" /> 匿名发布</label>
    </div>
    <button class="btn btn-primary btn-block" id="submitPost">发布</button>
  </div>
</main>

<!-- ===== 我的面板 ===== -->
<main id="panelMine" class="panel">
  <div class="mine-page">
    <div class="user-card">
      <div class="user-avatar" id="myAvatar">😊</div>
      <div class="user-name" id="myNickname"></div>
      <button class="btn btn-outline btn-small" id="btnEditProfile">编辑资料</button>
    </div>

    <div class="mine-tabs">
      <span class="mine-tab active" data-tab="myPosts">我的帖子</span>
      <span class="mine-tab" data-tab="myLikes">我赞过的</span>
      <span class="mine-tab" data-tab="myComments">我评论的</span>
    </div>

    <div class="mine-content" id="mineContent">
      <div class="tip">加载中...</div>
    </div>

    <div id="adminSection" style="display:none"><button class="btn btn-block btn-admin" id="btnAdminPanel">🛡️ 用户管理</button></div><button class="btn btn-block btn-logout" id="btnLogout">退出登录</button>
  </div>
</main>

<!-- ===== 底部导航栏 ===== -->
<nav id="bottomNav">
  <div class="nav-item active" data-panel="panelSquare">
    <span class="nav-icon">📋</span>
    <span class="nav-text">刷帖</span>
  </div>
  <div class="nav-item" data-panel="panelPost">
    <span class="nav-icon">✏️</span>
    <span class="nav-text">发帖</span>
  </div>
  <div class="nav-item" data-panel="panelMine">
    <span class="nav-icon">👤</span>
    <span class="nav-text">我的</span>
  </div>
</nav>

<!-- 评论弹窗 -->
<div id="commentModal" class="modal">
  <div class="modal-content comment-box">
    <div class="modal-header">
      <span class="modal-title">评论</span>
      <span class="modal-close" data-modal="commentModal">&times;</span>
    </div>
    <div id="commentList"></div>
    <div class="comment-input-row">
      <span class="reply-hint" id="replyHint" style="display:none"></span>
      <input type="text" id="commentInput" placeholder="说点什么..." maxlength="200" />
      <button class="btn btn-small btn-primary" id="sendComment">发送</button>
    </div>
  </div>
</div>

<!-- 编辑资料弹窗 -->
<div id="profileModal" class="modal">
  <div class="modal-content profile-box">
    <div class="modal-header">
      <span class="modal-title">编辑资料</span>
      <span class="modal-close" data-modal="profileModal">&times;</span>
    </div>
    <div class="form-group">
      <label>新昵称</label>
      <input type="text" id="editNickname" placeholder="输入新昵称..." maxlength="12" />
    </div>
    <div class="form-group">
      <label>原密码</label>
      <input type="password" id="editOldPwd" placeholder="输入原密码..." maxlength="20" />
    </div>
    <div class="form-group">
      <label>新密码（不修改则留空）</label>
      <input type="password" id="editNewPwd" placeholder="输入新密码..." maxlength="20" />
    </div>
    <button class="btn btn-primary btn-block" id="btnSaveProfile">保存</button>
  </div>
</div>

<!-- 管理员审核弹窗 -->
<div id="adminModal" class="modal">
  <div class="modal-content admin-box">
    <div class="modal-header">
      <span class="modal-title">🛡️ 用户管理</span>
      <span class="modal-close" data-modal="adminModal">&times;</span>
    </div>
    <div class="admin-tabs">
      <span class="admin-tab active" id="tabPending">待审核</span>
      <span class="admin-tab" id="tabApproved">已通过</span>
    </div>
    <div id="adminUserList" class="admin-list"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
